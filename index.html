<title>Coffeeshop Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F1E4C4;
    --surface:#FBF4E1;
    --surface-2:#E8D8A9;
    --ink:#26200F;
    --ink-soft:#6C5E3B;
    --ink-faint:#9C8B5D;
    --line:#DECA92;
    --green:#173B2C;
    --green-ink:#0E2A1F;
    --green-soft:#DDE7DC;
    --gold:#93661C;
    --gold-ink:#7A5416;
    --gold-soft:#F1D999;
    --gold-block:#E8C57C;
    --maroon:#742036;
    --maroon-ink:#5E1A2B;
    --maroon-soft:#EFD2D8;
    --shadow: 0 14px 34px -18px rgb(23 59 44 / .45);
    --sheet-shadow: 0 -18px 40px -14px rgb(23 59 44 / .35);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F2A1F;
      --surface:#173226;
      --surface-2:#1F3D2C;
      --ink:#F3ECDA;
      --ink-soft:#C6D3C7;
      --ink-faint:#8CA490;
      --line:#2C4A38;
      --green:#8FD6AC;
      --green-ink:#B9E9CC;
      --green-soft:#1F3729;
      --gold:#E8BD62;
      --gold-ink:#F1CE87;
      --gold-soft:#3B2F15;
      --gold-block:#4E3C17;
      --maroon:#EC93A4;
      --maroon-ink:#F3AEBB;
      --maroon-soft:#3C1E26;
      --shadow: 0 14px 34px -18px rgb(0 0 0 / .6);
      --sheet-shadow: 0 -18px 40px -14px rgb(0 0 0 / .55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F2A1F;
    --surface:#173226;
    --surface-2:#1F3D2C;
    --ink:#F3ECDA;
    --ink-soft:#C6D3C7;
    --ink-faint:#8CA490;
    --line:#2C4A38;
    --green:#8FD6AC;
    --green-ink:#B9E9CC;
    --green-soft:#1F3729;
    --gold:#E8BD62;
    --gold-ink:#F1CE87;
    --gold-soft:#3B2F15;
    --gold-block:#4E3C17;
    --maroon:#EC93A4;
    --maroon-ink:#F3AEBB;
    --maroon-soft:#3C1E26;
    --shadow: 0 14px 34px -18px rgb(0 0 0 / .6);
    --sheet-shadow: 0 -18px 40px -14px rgb(0 0 0 / .55);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.disp{ font-family:"Fraunces","Iowan Old Style",Georgia,serif; }
  ::selection{ background:var(--gold-soft); }
  button{ font-family:inherit; }
  a{ color:inherit; }

  .app{ display:flex; flex-direction:column; height:100%; min-height:0; }

  /* ---------- Top bar ---------- */
  .topbar{
    flex:none;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    box-shadow:0 10px 18px -18px rgb(0 0 0 / .3);
    padding-top:env(safe-area-inset-top,0px);
    position:relative;
    z-index:30;
  }
  .brandrow{ display:flex; align-items:center; gap:8px; padding:12px 20px 10px; }
  .brandrow .bean{
    width:24px;height:24px;border-radius:50%;
    background:var(--green);
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  :root[data-theme="dark"] .brandrow .bean{ background:var(--green-soft); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brandrow .bean{ background:var(--green-soft); } }
  .brandrow .bean svg{ width:13px;height:13px; }
  .brandrow .bean svg path{ stroke:#F3ECDA; }
  :root[data-theme="dark"] .brandrow .bean svg path{ stroke:#0F2A1F; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brandrow .bean svg path{ stroke:#0F2A1F; } }
  .brandrow .name{ font-size:11px; letter-spacing:.15em; text-transform:uppercase; font-weight:800; color:var(--ink-soft); }
  .brandrow .sub{ margin-left:auto; font-size:11.5px; color:var(--ink-faint); font-style:italic; font-family:"Fraunces",serif; }

  .tabs{
    margin:0 20px 16px;
    position:relative;
    display:grid;
    grid-template-columns:1fr 1fr;
    background:var(--surface-2);
    border-radius:999px;
    padding:6px;
  }
  .tabs .pill{
    position:absolute;
    top:6px; bottom:6px; left:6px;
    width:calc(50% - 6px);
    background:var(--green);
    border-radius:999px;
    transition:transform .38s cubic-bezier(.65,0,.35,1);
    box-shadow:var(--shadow);
  }
  .tabs[data-tab="food"] .pill{ transform:translateX(100%); background:var(--maroon); }
  .tabs button{
    position:relative; z-index:1; border:0; background:transparent;
    padding:20px 6px; font-size:22px; font-weight:800; color:var(--ink-soft);
    border-radius:999px; cursor:pointer; transition:color .3s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .tabs button[aria-selected="true"]{ color:#FBF8EE; }
  :root[data-theme="dark"] .tabs button[aria-selected="true"]{ color:#101710; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tabs button[aria-selected="true"]{ color:#101710; } }

  .chiprow-wrap{ overflow:hidden; }
  .chiprow{ display:flex; gap:16px; padding:12px 20px 44px; overflow-x:auto; scrollbar-width:none; }
  .chiprow::-webkit-scrollbar{ display:none; }
  .chiprow[hidden]{ display:none; }
  .chip{
    flex:none; border:3px solid var(--line); background:var(--surface); color:var(--ink-soft);
    padding:34px 42px; border-radius:999px; font-size:30px; font-weight:800; white-space:nowrap;
    cursor:pointer; transition:background .25s ease, color .25s ease, border-color .25s ease, transform .25s ease;
  }
  .chip.active{ color:#FBF8EE; border-color:transparent; transform:translateY(-1px); }
  .tabs[data-tab="drinks"] ~ .chiprow-wrap .chip.active{ background:var(--green); }
  .tabs[data-tab="food"] ~ .chiprow-wrap .chip.active{ background:var(--maroon); }
  :root[data-theme="dark"] .chip.active{ color:#101710; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.active{ color:#101710; } }

  /* ---------- Category cover gallery (swipe through, tap to open) ---------- */
  .gallery{ flex:1; min-height:0; position:relative; overflow:hidden; }
  .gallery[hidden]{ display:none; }
  .cover-track{
    height:100%; display:flex;
    overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
  }
  .cover-track::-webkit-scrollbar{ display:none; }
  .cover-card{
    flex:0 0 86%; width:86%; height:100%;
    margin-right:14px;
    scroll-snap-align:center;
    position:relative;
    border:0; padding:0; border-radius:26px; overflow:hidden;
    background:var(--surface-2);
    cursor:pointer;
    box-shadow:var(--shadow);
    display:flex; flex-direction:column;
    text-align:left;
  }
  .cover-card:first-child{ margin-left:20px; }
  .cover-card:last-child{ margin-right:20px; }
  .cover-card img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .cover-card::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgb(10 20 14 / 0) 40%, rgb(10 20 14 / .72) 100%);
  }
  .cover-card.no-photo{ display:flex; align-items:flex-end; }
  .cover-card.no-photo::after{ display:none; }
  .kind-coffee.cover-card.no-photo{ background:var(--green-soft); }
  .kind-sweet.cover-card.no-photo{ background:var(--gold-soft); }
  .kind-savory.cover-card.no-photo{ background:var(--maroon-soft); }
  .cover-counter{
    position:absolute; top:18px; right:18px; z-index:2;
    background:rgb(10 20 14 / .4); color:#F3ECDA;
    font-size:15px; font-weight:700; padding:7px 15px; border-radius:999px;
    backdrop-filter:blur(6px); font-variant-numeric:tabular-nums;
  }
  .cover-card.no-photo .cover-counter{ background:rgb(0 0 0 / .12); color:var(--ink-soft); }
  .cover-tap{
    position:absolute; top:18px; left:18px; z-index:2;
    background:rgb(10 20 14 / .4); color:#F3ECDA;
    font-size:14px; font-weight:700; padding:7px 14px; border-radius:999px;
    backdrop-filter:blur(6px);
  }
  .cover-card.no-photo .cover-tap{ background:rgb(0 0 0 / .12); color:var(--ink-soft); }
  .cover-title{ position:relative; z-index:2; margin-top:auto; padding:26px 24px 30px; width:100%; }
  .cover-title h2{ margin:0; font-size:44px; font-weight:700; font-style:italic; line-height:1.05; color:#FBF8EE; text-shadow:0 2px 14px rgb(0 0 0 / .35); text-wrap:balance; }
  .cover-card.no-photo .cover-title h2{ color:var(--ink); text-shadow:none; }
  .cover-note{ margin:10px 0 0; font-size:17px; color:#EDE7D2; font-style:italic; font-family:"Fraunces",serif; }
  .cover-card.no-photo .cover-note{ color:var(--ink-soft); }
  .cover-count{ margin:8px 0 0; font-size:15px; color:#D9E0D0; }
  .cover-card.no-photo .cover-count{ color:var(--ink-faint); }

  /* ---------- Detail panel (slides in over the gallery) ---------- */
  .detail{
    position:fixed; inset:0; z-index:35;
    background:var(--bg);
    display:flex; flex-direction:column;
    transform:translateX(100%);
    transition:transform .4s cubic-bezier(.32,.72,.33,1);
  }
  .detail.open{ transform:translateX(0); }
  .detail-photo{
    position:relative; flex:0 0 auto;
    height:clamp(260px, 42vh, 380px);
    overflow:hidden;
    background:var(--surface-2);
    padding-top:env(safe-area-inset-top,0px);
    display:flex; flex-direction:column;
  }
  .detail-photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .detail-photo::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgb(10 20 14 / .18) 0%, rgb(10 20 14 / 0) 30%, rgb(10 20 14 / .62) 100%);
  }
  .detail-photo.no-photo::after{ display:none; }
  .kind-coffee .detail-photo.no-photo{ background:var(--green-soft); }
  .kind-sweet .detail-photo.no-photo{ background:var(--gold-soft); }
  .kind-savory .detail-photo.no-photo{ background:var(--maroon-soft); }
  .detail-nav{
    position:absolute; left:0; right:0; z-index:2;
    top:calc(14px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px;
  }
  .detail-nav button{
    width:60px; height:60px; border-radius:50%; border:0;
    background:rgb(10 20 14 / .45); color:#F3ECDA; font-size:26px;
    backdrop-filter:blur(6px); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .detail-photo.no-photo .detail-nav button{ background:rgb(0 0 0 / .12); color:var(--ink-soft); }
  .detail-nav .spacer{ flex:1; }
  .detail-arrows{ display:flex; gap:14px; }
  .detail-title{ position:relative; z-index:2; padding:14px 24px 24px; margin-top:auto; }
  .detail-title h2{ margin:0; font-size:40px; font-weight:700; font-style:italic; line-height:1.05; color:#FBF8EE; text-shadow:0 2px 14px rgb(0 0 0 / .35); text-wrap:balance; }
  .detail-photo.no-photo .detail-title h2{ color:var(--ink); text-shadow:none; }
  .detail-note{ margin:8px 0 0; font-size:16px; color:#EDE7D2; font-style:italic; font-family:"Fraunces",serif; }
  .detail-photo.no-photo .detail-note{ color:var(--ink-soft); }

  .page-items{
    flex:1; min-height:0; overflow-y:auto;
    padding:16px 20px calc(28px + env(safe-area-inset-bottom,0px));
    -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; gap:14px;
  }

  .card{
    text-align:left; display:flex; gap:16px; align-items:flex-start; justify-content:space-between;
    background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:22px 20px;
    cursor:pointer;
    opacity:0; transform:translateY(14px);
    transition:opacity .5s ease, transform .5s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card.in{ opacity:1; transform:translateY(0); }
  .card:hover{ border-color:var(--ink-faint); box-shadow:var(--shadow); }
  .card:active{ transform:scale(.985); }
  .card.featured{ background:var(--gold-block); border-color:transparent; }
  .card.featured .desc{ color:var(--ink); opacity:.75; }
  .card.featured .vol{ color:var(--ink); opacity:.6; }
  .card .name-row{ display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; }
  .card .name{ font-weight:700; font-size:34px; line-height:1.2; }
  .card .desc{ margin:9px 0 0; font-size:21px; color:var(--ink-soft); line-height:1.5; max-width:40ch; }
  .card .vol{ margin-top:10px; font-size:18px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .badge{
    display:inline-flex; align-items:center; gap:3px; font-size:14px; font-weight:800; letter-spacing:.02em;
    padding:4px 10px; border-radius:999px; line-height:1.5;
  }
  .badge.cold{ background:var(--green-soft); color:var(--green-ink); }
  .badge.halal{ background:var(--gold-soft); color:var(--gold-ink); }
  .badge.age{ background:var(--maroon-soft); color:var(--maroon-ink); }
  .badge.fresh{ background:var(--gold-soft); color:var(--gold-ink); }

  .price-col{ flex:none; text-align:right; }
  .price{ font-weight:800; font-size:32px; white-space:nowrap; font-variant-numeric:tabular-nums; }

  /* ---------- Bottom sheet ---------- */
  .backdrop{
    position:fixed; inset:0; background:rgb(15 20 13 / .5);
    opacity:0; pointer-events:none; transition:opacity .3s ease; z-index:40;
  }
  .backdrop.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; max-width:640px; margin:0 auto;
    background:var(--surface); border-radius:22px 22px 0 0; box-shadow:var(--sheet-shadow);
    padding:14px 22px calc(26px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%); transition:transform .4s cubic-bezier(.32,.72,.33,1);
    z-index:41; max-height:80vh; overflow-y:auto;
  }
  .sheet.open{ transform:translateY(0); }
  .sheet .grabber{ width:36px; height:4px; border-radius:99px; background:var(--line); margin:0 auto 16px; }
  .sheet .kicker{ font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:800; color:var(--ink-faint); margin-bottom:6px; }
  .sheet h3{ margin:0 0 8px; font-size:24px; font-weight:600; line-height:1.2; text-wrap:balance; }
  .sheet .badges{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .sheet .desc{ font-size:14.5px; line-height:1.6; color:var(--ink-soft); margin:0 0 18px; }
  .sheet .meta{ display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:16px; }
  .sheet .meta .vol{ font-size:12.5px; color:var(--ink-faint); }
  .sheet .meta .price{ font-size:22px; }
  .sheet .soon{ margin-top:14px; font-size:12px; color:var(--ink-faint); background:var(--surface-2); border-radius:10px; padding:9px 12px; text-align:center; }
  .sheet .close{
    position:absolute; top:14px; right:16px; width:30px; height:30px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none !important; opacity:1 !important; transform:none !important; }
    .tabs .pill, .sheet, .backdrop, .chip, .carousel{ transition:none !important; scroll-behavior:auto !important; }
  }
</style>

<div class="app">
  <header class="topbar">
    <div class="brandrow">
      <span class="bean"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3c4 1 7 4.5 7 8.5A7 7 0 1 1 8.2 4.6" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      <span class="name">Coffeeshop Company</span>
      <span class="sub">Меню по QR</span>
    </div>
    <div class="tabs" id="tabs" data-tab="drinks">
      <div class="pill"></div>
      <button id="tab-drinks" role="tab" aria-selected="true">☕ Напитки</button>
      <button id="tab-food" role="tab" aria-selected="false">🍽 Еда</button>
    </div>
    <div class="chiprow-wrap">
      <div class="chiprow" id="chips-drinks"></div>
      <div class="chiprow" id="chips-food" hidden></div>
    </div>
  </header>

  <div class="gallery" id="gallery-drinks" data-group="drinks"><div class="cover-track" id="cover-drinks"></div></div>
  <div class="gallery" id="gallery-food" data-group="food" hidden><div class="cover-track" id="cover-food"></div></div>
</div>

<div class="detail" id="detail">
  <div class="detail-photo" id="detailPhoto">
    <img id="detailImg" src="" alt="">
    <div class="detail-nav">
      <button id="detailBack" aria-label="Назад к категориям">←</button>
      <span class="spacer"></span>
      <div class="detail-arrows">
        <button id="detailPrev" aria-label="Предыдущая категория">‹</button>
        <button id="detailNext" aria-label="Следующая категория">›</button>
      </div>
    </div>
    <div class="detail-title">
      <h2 id="detailTitle">Название</h2>
      <p class="detail-note" id="detailNote" hidden></p>
    </div>
  </div>
  <div class="page-items" id="detailItems"></div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <button class="close" id="sheetClose" aria-label="Закрыть">✕</button>
  <div class="grabber"></div>
  <div class="kicker" id="sheetCat">Категория</div>
  <h3 id="sheetName">Название</h3>
  <div class="badges" id="sheetBadges"></div>
  <p class="desc" id="sheetDesc"></p>
  <div class="meta">
    <span class="vol" id="sheetVol"></span>
    <span class="price" id="sheetPrice"></span>
  </div>
  <div class="soon">Онлайн-заказ и оплата подключим на следующем этапе — пока меню можно только листать</div>
</div>

<script>

  const chipsHost = { drinks: document.getElementById('chips-drinks'), food: document.getElementById('chips-food') };
  const galleryEl = { drinks: document.getElementById('gallery-drinks'), food: document.getElementById('gallery-food') };
  const trackEl = { drinks: document.getElementById('cover-drinks'), food: document.getElementById('cover-food') };
  const tabsEl = document.getElementById('tabs');

  function badgeHTML(list){
    let out = '';
    (list||[]).forEach(b=>{ out += `<span class="badge ${b}">${BADGE[b]}</span>`; });
    return out;
  }

  function cardHTML(cat, it){
    return `<button class="card${it.f?' featured':''}" type="button" data-cat="${cat.title}" data-name="${it.n}" data-price="${it.p}" data-vol="${it.v||''}" data-desc="${(it.d||'').replace(/"/g,'&quot;')}" data-badges="${(it.badges||[]).join(',')}">
      <div>
        <div class="name-row"><span class="name">${it.n}</span>${badgeHTML(it.badges)}</div>
        ${it.tag ? `<p class="desc">${it.tag}</p>` : (it.d ? `<p class="desc">${it.d}</p>` : '')}
        ${it.v ? `<div class="vol">${it.v}</div>` : ''}
      </div>
      <div class="price-col"><div class="price">${it.p}</div></div>
    </button>`;
  }

  function render(){
    ['drinks','food'].forEach(group=>{
      const cats = CATALOG[group];
      const html = cats.map((cat,i)=>{
        const photoInner = cat.img
          ? `<img src="${cat.img}" alt="${cat.title}" loading="${i===0?'eager':'lazy'}">`
          : '';
        return `<button class="cover-card kind-${cat.kind}${cat.img?'':' no-photo'}" type="button" data-index="${i}">
          ${photoInner}
          <span class="cover-counter">${i+1} / ${cats.length}</span>
          <span class="cover-tap">Открыть меню →</span>
          <div class="cover-title">
            <h2>${cat.title}</h2>
            ${cat.note ? `<p class="cover-note">${cat.note}</p>` : ''}
            <p class="cover-count">${cat.items.length} ${itemsWord(cat.items.length)}</p>
          </div>
        </button>`;
      }).join('');
      trackEl[group].innerHTML = html;
      chipsHost[group].innerHTML = cats.map((c,i)=>`<button class="chip${i===0?' active':''}" data-index="${i}">${c.title}</button>`).join('');
    });
  }
  function itemsWord(n){
    const mod10 = n%10, mod100 = n%100;
    if(mod10===1 && mod100!==11) return 'позиция';
    if([2,3,4].includes(mod10) && ![12,13,14].includes(mod100)) return 'позиции';
    return 'позиций';
  }
  render();

  // ---- tab switching ----
  const tabDrinks = document.getElementById('tab-drinks');
  const tabFood = document.getElementById('tab-food');
  function setTab(tab){
    tabsEl.dataset.tab = tab;
    tabDrinks.setAttribute('aria-selected', tab==='drinks');
    tabFood.setAttribute('aria-selected', tab==='food');
    chipsHost.drinks.hidden = tab!=='drinks';
    chipsHost.food.hidden = tab!=='food';
    galleryEl.drinks.hidden = tab!=='drinks';
    galleryEl.food.hidden = tab!=='food';
    closeDetail();
  }
  tabDrinks.addEventListener('click', ()=>setTab('drinks'));
  tabFood.addEventListener('click', ()=>setTab('food'));

  // ---- chip click -> swipe gallery to cover ----
  function goToIndex(group, index){
    const track = trackEl[group];
    const card = track.children[index];
    if(card){ track.scrollTo({ left: card.offsetLeft - 20, behavior:'smooth' }); }
  }
  ['drinks','food'].forEach(group=>{
    chipsHost[group].querySelectorAll('.chip').forEach(chip=>{
      chip.addEventListener('click', ()=> goToIndex(group, +chip.dataset.index));
    });
  });

  // ---- gallery scroll -> active chip ----
  ['drinks','food'].forEach(group=>{
    const track = trackEl[group];
    let ticking = false;
    track.addEventListener('scroll', ()=>{
      if(ticking) return;
      ticking = true;
      requestAnimationFrame(()=>{
        ticking = false;
        const cards = [...track.children];
        const center = track.scrollLeft + track.clientWidth/2;
        let idx = 0, best = Infinity;
        cards.forEach((c,i)=>{
          const mid = c.offsetLeft + c.offsetWidth/2;
          const d = Math.abs(mid - center);
          if(d < best){ best = d; idx = i; }
        });
        const chips = chipsHost[group].querySelectorAll('.chip');
        chips.forEach((c,i)=>{
          const isActive = i===idx;
          c.classList.toggle('active', isActive);
          if(isActive){ c.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'}); }
        });
      });
    }, { passive:true });
  });

  // ---- detail panel ----
  const detail = document.getElementById('detail');
  const detailPhoto = document.getElementById('detailPhoto');
  const detailImg = document.getElementById('detailImg');
  const detailTitle = document.getElementById('detailTitle');
  const detailNote = document.getElementById('detailNote');
  const detailItems = document.getElementById('detailItems');
  const detailBack = document.getElementById('detailBack');
  const detailPrev = document.getElementById('detailPrev');
  const detailNext = document.getElementById('detailNext');
  let currentGroup = null, currentIndex = 0;

  function openDetail(group, index){
    const cats = CATALOG[group];
    const cat = cats[index];
    currentGroup = group; currentIndex = index;
    detailPhoto.className = 'detail-photo kind-' + cat.kind + (cat.img ? '' : ' no-photo');
    if(cat.img){ detailImg.src = cat.img; detailImg.alt = cat.title; detailImg.hidden = false; }
    else { detailImg.hidden = true; detailImg.removeAttribute('src'); }
    detailTitle.textContent = cat.title;
    if(cat.note){ detailNote.textContent = cat.note; detailNote.hidden = false; } else { detailNote.hidden = true; }
    detailItems.innerHTML = cat.items.map(it=>cardHTML(cat,it)).join('');
    detailItems.scrollTop = 0;
    detailPrev.disabled = index<=0;
    detailNext.disabled = index>=cats.length-1;
    detail.classList.add('open');
    revealCards(detailItems);
  }
  function closeDetail(){ detail.classList.remove('open'); }
  function stepDetail(delta){
    if(currentGroup===null) return;
    const next = currentIndex + delta;
    if(next<0 || next>=CATALOG[currentGroup].length) return;
    openDetail(currentGroup, next);
  }
  detailBack.addEventListener('click', closeDetail);
  detailPrev.addEventListener('click', ()=>stepDetail(-1));
  detailNext.addEventListener('click', ()=>stepDetail(1));

  setTab('drinks');

  ['drinks','food'].forEach(group=>{
    trackEl[group].addEventListener('click', (e)=>{
      const card = e.target.closest('.cover-card');
      if(card){ openDetail(group, +card.dataset.index); }
    });
  });

  // ---- card reveal on scroll ----
  function revealCards(container){
    const reveal = new IntersectionObserver((entries)=>{
      entries.forEach((entry,i)=>{
        if(entry.isIntersecting){
          entry.target.style.transitionDelay = (i%4 * 45) + 'ms';
          entry.target.classList.add('in');
          reveal.unobserve(entry.target);
        }
      });
    }, { root:container, threshold:0.15 });
    container.querySelectorAll('.card').forEach(c=>reveal.observe(c));
  }

  // ---- bottom sheet ----
  const backdrop = document.getElementById('backdrop');
  const sheet = document.getElementById('sheet');
  const sheetCat = document.getElementById('sheetCat');
  const sheetName = document.getElementById('sheetName');
  const sheetDesc = document.getElementById('sheetDesc');
  const sheetVol = document.getElementById('sheetVol');
  const sheetPrice = document.getElementById('sheetPrice');
  const sheetBadges = document.getElementById('sheetBadges');

  function openSheet(card){
    sheetCat.textContent = card.dataset.cat;
    sheetName.textContent = card.dataset.name;
    sheetDesc.textContent = card.dataset.desc || '';
    sheetDesc.hidden = !card.dataset.desc;
    sheetVol.textContent = card.dataset.vol;
    sheetPrice.textContent = card.dataset.price;
    const badges = (card.dataset.badges||'').split(',').filter(Boolean);
    sheetBadges.innerHTML = badgeHTML(badges);
    backdrop.classList.add('open');
    sheet.classList.add('open');
  }
  function closeSheet(){
    backdrop.classList.remove('open');
    sheet.classList.remove('open');
  }
  document.addEventListener('click', (e)=>{
    const card = e.target.closest('.card');
    if(card) openSheet(card);
  });
  backdrop.addEventListener('click', closeSheet);
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeSheet(); });
})();
</script>
